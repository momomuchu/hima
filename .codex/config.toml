[features]
codex_hooks = true

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'norm hook session-start --format codex'

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'norm hook user-prompt-submit --format codex'

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'norm hook pre-tool-use --format codex'

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'norm hook post-tool-use --format codex'

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'norm hook stop --format codex'

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
OMC_SKIP_HOOKS = "subagent-stop"
